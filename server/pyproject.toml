[project]
name = "distill-server"
version = "0.1.0"
description = "Distill backend: turn messy documents into structured, queryable data"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Web layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",   # multipart upload parsing
    "sse-starlette>=2.2",         # Server-Sent Events with event ids

    # Configuration and validation
    "pydantic>=2.10",
    "pydantic-settings>=2.7",

    # Persistence
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",

    # Document parsing. See decision D3.
    "pdfplumber>=0.11",           # word-level bounding boxes for provenance
    "pypdfium2>=4.30",            # fast page rendering to PNG
    "pytesseract>=0.3.13",        # OCR for pages with no text layer
    "pillow>=11.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "filetype>=1.2",              # content sniffing from bytes, pure Python, no libmagic

    # Grounding and query safety
    "rapidfuzz>=3.10",            # fuzzy quote location, see implementation.md 6.3
    "sqlglot>=26.0",              # SQL allow-list parsing, see decision D10

    # Large Language Model access. See decisions D13 and D20.
    # Instructor was removed on purpose: it would convert response schemas with its own
    # converter, bypassing app/llm/jsonschema.py, which is the tested mitigation for the
    # provider schema subset problem. See app/llm/gemini.py for the full reasoning.
    "google-genai>=1.0",

    # Observability
    "structlog>=24.4",

    # Agent-to-User Interface message validation
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",                # async test client
    "ruff>=0.8",
    "mypy>=1.14",
    "reportlab>=4.2",             # generates PDF fixtures for geometry tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "ASYNC",    # async correctness
    "S",        # security (bandit)
    "C4",       # comprehensions
    "RUF",      # ruff-specific
]
ignore = [
    "S101",     # assert is fine in tests, and used for invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
# Migration scripts are machine-generated by `alembic revision --autogenerate`. Linting
# them means hand-editing generated output on every revision, which is churn with no
# benefit. The env.py that DRIVES them is hand-written and stays linted.
"app/db/migrations/versions/**" = ["ALL"]
"app/db/migrations/env.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
# Third-party libraries without type stubs. Narrow, deliberate exceptions.
[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pypdfium2.*", "pytesseract.*", "filetype.*", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a real Postgres database",
]
